[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-screener"
version = "0.1.0"
description = "A personal stock screener."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Lars Spangenberg", email = "lazerus88@gmail.com" }]
license = { text = "MIT" }
dependencies = [
  "pandas>=2.3.2",
  "yfinance>=0.2.40",
  "platformdirs>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
